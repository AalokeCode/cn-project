# nginx.conf — Mac B (Aaloke), 10.7.20.225
# Location on Mac B (Apple Silicon Homebrew): /opt/homebrew/etc/nginx/nginx.conf

events {}

http {
    upstream backend {
        server 10.7.13.142:3001;  # Backend A — Mac C (Arina)
        server 10.7.20.219:3002;  # Backend B — Mac D (Hemanth)
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test;

        ssl_certificate /Users/aalokeeppalapalli/documents/education/nst/cn/app.team1.test.pem;
        ssl_certificate_key /Users/aalokeeppalapalli/documents/education/nst/cn/app.team1.test-key.pem;

        location / {
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
