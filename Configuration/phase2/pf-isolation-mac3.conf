# CN Project - Phase 2 - Extension C - Backend isolation for Mac 3 (Backend A, port 3001)
# Only the edge (Mac 2) may connect to port 3001. Every other host is rejected.
#
# Apply:    sudo pfctl -f configuration/phase2/pf-isolation-mac3.conf -E
# Check:    sudo pfctl -sr
# Rollback: sudo pfctl -f /etc/pf.conf        (macOS default rules, never edited)
#           sudo pfctl -X <token printed by -E> (disables pf again if it was off before)

# --- Macros and options (pf requires these before any scrub/anchor/filter lines) ---
edge = "@MAC2_IP@"
backend_port = "3001"
set skip on lo0

# --- macOS default rules (copied from /etc/pf.conf so system services keep working) ---
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

# --- project rules ---
# Mac 2 (nginx) is allowed in
pass in quick proto tcp from $edge to any port $backend_port

# Everyone else is refused (TCP RST, so curl fails immediately with "connection refused")
block return in quick proto tcp from any to any port $backend_port
