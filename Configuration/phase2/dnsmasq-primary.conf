# CN Project - Phase 2 - PRIMARY private DNS (Mac 1)
# Same as Phase 1, plus a visible TTL for Extension B.

# Listen on Mac 1's LAN address
listen-address=@MAC1_IP@

# Only answer DNS queries on the configured interface
interface=en0
bind-interfaces

# Project DNS records -> edge (Mac 2)
# Extension E (edge migration): change both lines to the standby edge IP (Mac 3: @MAC3_IP@)
address=/app.team@TEAM@.test/@MAC2_IP@
address=/api.team@TEAM@.test/@MAC2_IP@

# Extension B: TTL for our own records (Phase 1 default was 0 = never cached)
local-ttl=30

# Don't read /etc/resolv.conf
no-resolv

# Forward all other DNS queries to public DNS
server=8.8.8.8
server=1.1.1.1

# Cache DNS responses
cache-size=1000
