<!doctype html>
<html><head><meta charset="utf-8"><title>Phase 2 Topology</title>
<style>
  body { margin: 0; background: #ffffff; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  svg text { font-family: inherit; }
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">Phase 2 Topology — Team 1</text>
  <text x="40" y="84" font-size="17" fill="#475569">Same private Wi-Fi LAN 10.7.0.0/19 · mask 255.255.224.0 · gateway 10.7.0.1 · domain app.team1.test / api.team1.test → 10.7.22.206 (TTL 30 s)</text>

  <!-- LAN boundary -->
  <rect x="24" y="110" width="1352" height="760" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="140" font-size="15" fill="#64748b">private LAN</text>

  <!-- Client -->
  <rect x="80" y="380" width="250" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="205" y="418" font-size="20" font-weight="700" text-anchor="middle" fill="#312e81">Client</text>
  <text x="205" y="446" font-size="15" text-anchor="middle" fill="#3730a3">Mac 1 (10.7.5.108)</text>
  <text x="205" y="468" font-size="15" text-anchor="middle" fill="#3730a3">or Mac 4 (10.7.2.47)</text>
  <text x="205" y="492" font-size="13" text-anchor="middle" fill="#4f46e5">curl --cacert rootCA.pem</text>

  <!-- Mac 1 DNS primary -->
  <rect x="80" y="170" width="300" height="140" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="230" y="206" font-size="20" font-weight="700" text-anchor="middle" fill="#164e63">Mac 1 — Krishna</text>
  <text x="230" y="234" font-size="16" text-anchor="middle" fill="#155e75">Primary DNS (dnsmasq)</text>
  <text x="230" y="258" font-size="16" text-anchor="middle" fill="#155e75">10.7.5.108 · UDP/TCP 53</text>
  <text x="230" y="284" font-size="13" text-anchor="middle" fill="#0e7490">≈ Route 53 primary</text>

  <!-- Mac 4 backup DNS -->
  <rect x="80" y="660" width="300" height="140" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="230" y="696" font-size="20" font-weight="700" text-anchor="middle" fill="#164e63">Mac 4 — Hemanth</text>
  <text x="230" y="724" font-size="16" text-anchor="middle" fill="#155e75">Backup DNS (dnsmasq) · Ext A</text>
  <text x="230" y="748" font-size="16" text-anchor="middle" fill="#155e75">10.7.2.47 · UDP/TCP 53</text>
  <text x="230" y="774" font-size="13" text-anchor="middle" fill="#0e7490">same records, TTL 30 s</text>

  <!-- DNS arrows -->
  <line x1="205" y1="380" x2="215" y2="314" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="225" y="352" font-size="14" fill="#334155">① DNS query (UDP 53)</text>
  <line x1="205" y1="510" x2="215" y2="656" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="225" y="590" font-size="14" fill="#334155">① if primary down</text>

  <!-- Mac 2 Edge -->
  <rect x="510" y="345" width="370" height="200" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="695" y="384" font-size="22" font-weight="700" text-anchor="middle" fill="#78350f">Mac 2 — Aaloke · EDGE</text>
  <text x="695" y="412" font-size="16" text-anchor="middle" fill="#92400e">nginx · 10.7.22.206 · TCP 443</text>
  <text x="695" y="436" font-size="15" text-anchor="middle" fill="#92400e">TLS termination (mkcert team CA) · HTTP/2</text>
  <text x="695" y="460" font-size="15" text-anchor="middle" fill="#92400e">round-robin upstream backend_cluster</text>
  <text x="695" y="484" font-size="15" text-anchor="middle" fill="#92400e">max_fails=1 fail_timeout=10s · proxy_next_upstream</text>
  <text x="695" y="510" font-size="15" text-anchor="middle" fill="#92400e">adds Cache-Control: max-age=60 · X-Edge: mac2</text>
  <text x="695" y="532" font-size="13" text-anchor="middle" fill="#b45309">≈ AWS ALB / CDN edge · single point of failure</text>

  <line x1="330" y1="445" x2="506" y2="445" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <text x="340" y="432" font-size="14" fill="#334155">② HTTPS TCP 443</text>
  <text x="340" y="468" font-size="13" fill="#64748b">TLS 1.3, ALPN h2</text>

  <!-- Backend A -->
  <rect x="1020" y="170" width="320" height="160" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1180" y="206" font-size="20" font-weight="700" text-anchor="middle" fill="#064e3b">Mac 3 — Arina</text>
  <text x="1180" y="234" font-size="16" text-anchor="middle" fill="#065f46">Backend A (Python)</text>
  <text x="1180" y="258" font-size="16" text-anchor="middle" fill="#065f46">10.7.17.193 · TCP 3001</text>
  <text x="1180" y="282" font-size="13" text-anchor="middle" fill="#047857">X-Backend: A · ETag · 304</text>
  <text x="1180" y="306" font-size="13" text-anchor="middle" fill="#047857">+ standby edge :443 (Ext E)</text>

  <!-- Backend B -->
  <rect x="1020" y="560" width="320" height="160" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1180" y="596" font-size="20" font-weight="700" text-anchor="middle" fill="#064e3b">Mac 4 — Hemanth</text>
  <text x="1180" y="624" font-size="16" text-anchor="middle" fill="#065f46">Backend B (Python)</text>
  <text x="1180" y="648" font-size="16" text-anchor="middle" fill="#065f46">10.7.2.47 · TCP 3002</text>
  <text x="1180" y="672" font-size="13" text-anchor="middle" fill="#047857">X-Backend: B · ETag · 304</text>
  <text x="1180" y="696" font-size="13" text-anchor="middle" fill="#047857">pf: only 10.7.22.206 allowed (Ext C)</text>

  <!-- edge to backends -->
  <line x1="880" y1="400" x2="1016" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <text x="935" y="300" font-size="14" text-anchor="end" fill="#334155">③ HTTP :3001</text>
  <line x1="880" y1="490" x2="1016" y2="620" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <text x="955" y="615" font-size="14" text-anchor="end" fill="#334155">③ HTTP :3002</text>
  <text x="960" y="452" font-size="13" fill="#64748b">A, B, A, B …</text>

  <!-- Ext E cutover -->
  <path d="M 330 400 L 450 400 L 450 140 L 1180 140 L 1180 164" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#arrDash)"/>
  <text x="470" y="130" font-size="14" fill="#b45309">Ext E: DNS cut over to 10.7.17.193 → HTTPS to the standby edge on Mac 3 (X-Edge: mac3)</text>

  <!-- legend -->
  <rect x="510" y="640" width="430" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="530" y="670" font-size="16" font-weight="700" fill="#0f172a">Extensions</text>
  <text x="530" y="696" font-size="14" fill="#334155">A  backup DNS on Mac 4 keeps names resolving</text>
  <text x="530" y="720" font-size="14" fill="#334155">B  TTL 30 s: cached answers until expiry / flush</text>
  <text x="530" y="744" font-size="14" fill="#334155">C  pf on Mac 3/4: only the edge reaches :3001/:3002</text>
  <text x="530" y="768" font-size="14" fill="#334155">D  nginx marks a dead backend down, retries the other</text>
  <text x="530" y="792" font-size="14" fill="#334155">E  standby edge on Mac 3, DNS-based cutover</text>
  <text x="530" y="816" font-size="14" fill="#334155">F  live fault, diagnosed DNS → TCP → TLS → HTTP</text>
</svg>
</body></html>
