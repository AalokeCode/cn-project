# CN Project - Phase 2 - Edge nginx (Mac 2)
# Same as Phase 1, plus failover (Extension D) and HTTP/2.
# Extension E: copy this file unchanged to the standby edge (Mac 3), together with the certs.

events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Round-robin between Mac 3 and Mac 4.
        # Extension D (passive health check): after 1 failed attempt, a backend is
        # marked down for 10s, then nginx tries it again. When it answers,
        # round-robin across both backends resumes automatically.
        server @MAC3_IP@:3001 max_fails=1 fail_timeout=10s;
        server @MAC4_IP@:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.team@TEAM@.test api.team@TEAM@.test;

        # TLS certificate paths
        ssl_certificate /opt/homebrew/etc/nginx/certs/app.team@TEAM@.test.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team@TEAM@.test-key.pem;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extension D: give up on a dead backend quickly and retry the request
            # on the other one, so the client still gets a 200.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # Hide the backend's copy so clients get a single Cache-Control header
            proxy_hide_header Cache-Control;
            add_header Cache-Control "max-age=60";

            # Extension E: shows which edge served the request.
            # This is the ONLY line to change on the standby copy (set it to "mac3").
            add_header X-Edge "mac2" always;
        }
    }
}
